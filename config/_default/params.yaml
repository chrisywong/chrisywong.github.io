hugoblox:
  schema: "2.0"
  identity:
    name: ""
    type: person
    tagline: ""
    description: ""
  theme:
    mode: system
    pack: default
    colors:
      primary: "blue"
      secondary: ""
      neutral: ""
  typography:
    font: sans
    size: md
    pack: academic
  layout:
    radius: md
    spacing: compact
    avatar_shape: rounded
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
    language_switcher: false
  footer:
    style: minimal
    language_switcher: true
  copyright:
    notice: © {year} {name}
  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: ieee
  search:
    enable: true
